# Cloudflare Tunnel config for whencanwemeet.app — live copy of what is
# deployed at /etc/cloudflared/config.yml on the Pi.
#
# The Pi dials OUT to Cloudflare, so nothing is exposed inbound: no port
# forwarding, no firewall holes, and the home IP is never published in DNS.
#
# The credentials JSON referenced below is a SECRET and is not in this repo.

tunnel: whencanwemeet
credentials-file: /etc/cloudflared/c590e440-17bc-4b7b-b980-3abcc7ff91c8.json

# Do not let a slow origin look like an outage.
originRequest:
  connectTimeout: 10s
  noTLSVerify: false

ingress:
  - hostname: whencanwemeet.app
    service: http://localhost:3000
  - hostname: www.whencanwemeet.app
    service: http://localhost:3000
  # Every tunnel config must end in a catch-all, or cloudflared refuses to start.
  - service: http_status:404
