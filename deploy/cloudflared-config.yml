# Cloudflare Tunnel config for whencanwemeet.app
#
# Install to /etc/cloudflared/config.yml (needs sudo), replacing <TUNNEL-UUID>
# with the id printed by `cloudflared tunnel create whencanwemeet`.
#
# The Pi dials OUT to Cloudflare, so nothing is exposed inbound: no port
# forwarding, no firewall holes, and the home IP is never published in DNS.

tunnel: whencanwemeet
credentials-file: /root/.cloudflared/<TUNNEL-UUID>.json

# Do not let a slow origin look like an outage.
originRequest:
  connectTimeout: 10s
  noTLSVerify: false

ingress:
  - hostname: whencanwemeet.app
    service: http://localhost:3000
  - hostname: www.whencanwemeet.app
    service: http://localhost:3000
  # Every tunnel config must end in a catch-all, or cloudflared refuses to start.
  - service: http_status:404
